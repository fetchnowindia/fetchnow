<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FetchNow — Verify Email</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fffaf0;color:#101828;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;margin:20px;background:#fff;border:1px solid #e7e9ee;border-radius:18px;padding:28px;box-shadow:0 8px 25px #00000010;text-align:center}.logo{font-size:25px;font-weight:900}.y{color:#e6a900}.msg{margin-top:18px;padding:14px;border-radius:10px;background:#f2f4f7}.ok{background:#eefdf5;color:#087443}.err{background:#fff1f1;color:#a12a2a}a{display:inline-block;margin-top:18px;padding:12px 18px;background:#ffbf00;color:#111;text-decoration:none;border-radius:9px;font-weight:800}</style></head><body><div class="card"><div class="logo">⚡ Fetch<span class="y">Now</span></div><h1>Email Verification</h1><div id="msg" class="msg">Verifying your email…</div><a href="/" id="home">Back to FetchNow</a></div><script>(async()=>{const t=new URLSearchParams(location.search).get('token');const m=document.getElementById('msg');if(!t){m.className='msg err';m.textContent='Verification token is missing.';return}try{const r=await fetch('/api/partners/verify?token='+encodeURIComponent(t));const d=await r.json();m.className='msg '+(r.ok?'ok':'err');m.textContent=d.message||d.error||'Verification failed.'}catch(e){m.className='msg err';m.textContent='Could not verify email. Please try again.'}})()</script></body></html>
